<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sort Algorithm Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sort Algorithm Battle</h1>

  <!-- 1. Setup Screen -->
  <div id="setup-screen" class="box">
    <h2>Game Settings</h2>
    <label for="player-count-input">Number of Players (1–6):</label><br>
    <input type="number" id="player-count-input" min="1" max="6" value="3" style="width: 60px; font-size: 16px; margin: 10px 0;"><br>
    
    <div id="player-name-inputs"></div>
    
    <button id="start-game-btn" style="margin-top: 15px;">Start Game!</button>
  </div>

  <!-- 2. Main Game Screen -->
  <div id="game-main-screen" class="hidden">
    <div id="game-status">
      <p>Current Phase: <span id="phase-name">Preparing</span></p>
    </div>

    <!-- Target Data Display -->
    <div id="game-board" class="box">
      <h2>Target Data</h2>
      <div id="chart-container" class="chart-box"></div>
    </div>

    <!-- Pass and Play Section -->
    <div id="pass-and-play-section" class="box">
      <div id="cover-screen">
        <h3 id="current-player-title">Player's Turn</h3>
        <p>Make sure others aren't looking at your screen!</p>
        <button id="show-hand-btn">Check Hand & Play</button>
      </div>

      <div id="action-screen" class="hidden">
        <h3 id="action-prompt-title">Your Hand (Choose 1 card)</h3>
        <div id="hand-container"></div>
      </div>
    </div>

    <!-- 3. Simultaneous Race Animation Section -->
    <div id="race-section" class="hidden box" style="max-width: 800px;">
      <h2>🚀 Sort Battle Start!</h2>
      <div id="anim-controls" style="margin-bottom: 15px;">
        <label>Speed: 
          <select id="speed-select" style="padding: 5px; font-size: 14px;">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <button id="start-race-btn" style="margin-left: 10px;">Start All!</button>
      </div>
      <div id="racers-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;"></div>
    </div>
  </div>

  <!-- 4. Result Phase Section -->
  <div id="next-phase-section" class="hidden box" style="margin-top: 20px;">
    <h2>🏆 Round Results 🏆</h2>
    <div id="result-summary" style="margin: 15px 0; text-align: left; display: inline-block;"></div><br>
    <button id="next-action-btn">Next Round</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
